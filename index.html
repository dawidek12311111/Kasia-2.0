<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e0517a">
<title>Kasia 2.0</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kasia 2.0">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#fff6f8;--card:#fff;--ink:#2d2226;--mute:#8c7a81;--line:#f1dfe4;--acc:#e0517a;--acc-s:#fde3ea;--ok:#2f9e6e;--ok-s:#dff3ea;--warn:#e9823a;--warn-s:#fdebdc;--blue:#4b7bd8;--blue-s:#e3ecfb}
@media (prefers-color-scheme:dark){:root{--bg:#171214;--card:#231b1e;--ink:#f6ecef;--mute:#a7959b;--line:#382c31;--acc:#f06a90;--acc-s:#3d2129;--ok:#4cc08c;--ok-s:#1d3329;--warn:#f39a55;--warn-s:#3a2a1c;--blue:#7aa2f0;--blue-s:#1f2a3d}}
*{box-sizing:border-box;margin:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto}
header h1{font-size:21px;font-weight:800}header h1 span{color:var(--acc)}
.sync{font-size:12px;color:var(--mute)}
main{max-width:640px;margin:0 auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.card h2{font-size:16px;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 14px;background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:var(--acc-s);color:var(--acc)}
button.mini{padding:6px 10px;font-size:13px;border-radius:10px}
button.icon{background:none;color:var(--mute);padding:4px 8px;font-size:16px}
button:disabled{opacity:.35}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);font-weight:700;margin:10px 0 4px}
label>input,label>select,label>textarea{margin-top:4px;color:var(--ink);font-weight:400}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mute{color:var(--mute)}.small{font-size:13px}.ok{color:var(--ok)}.warn{color:var(--warn)}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.datebar button{background:var(--card);color:var(--ink);border:1px solid var(--line);width:44px;font-size:20px;padding:6px}
.dlabel{position:relative;flex:1;text-align:center;font-weight:800;font-size:17px;color:var(--ink);margin:0}
.dlabel small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.dlabel input{position:absolute;inset:0;opacity:0}
.past{background:var(--warn-s);color:var(--warn);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;text-align:center;margin-top:8px}
.hero{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .in b{font-size:26px;font-weight:800;line-height:1}.ring .in span{font-size:12px;color:var(--mute)}
.kv{flex:1;display:grid;gap:6px}
.kv div{display:flex;justify-content:space-between;font-size:14px}.kv b{font-weight:800}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.mac div{font-size:12px;color:var(--mute)}.mac b{color:var(--ink);font-size:14px}
details{margin-top:12px;font-size:13px}summary{cursor:pointer;color:var(--acc);font-weight:700}
.calc{margin-top:8px;display:grid;gap:4px}.calc div{display:flex;justify-content:space-between}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;font-size:13px}
.actions button b{font-size:22px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.item .t{flex:1;min-width:0}.item .t div{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--mute);font-size:12px;display:block}
.item .k{font-weight:800;white-space:nowrap}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
.grp{font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 2px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;background:var(--acc-s);color:var(--acc);margin-left:4px}
.tag.b{background:var(--blue-s);color:var(--blue)}
.ai{background:linear-gradient(135deg,var(--acc-s),var(--blue-s));border:0}
.ai p{line-height:1.5}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;font-size:11px;padding:4px 6px;gap:1px}
nav button b{font-size:21px;filter:grayscale(1);opacity:.7}nav button.on{color:var(--acc)}nav button.on b{filter:none;opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.open{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
#modal h3{font-size:18px;font-weight:800;margin-bottom:4px}
.btns{display:flex;gap:10px;margin-top:16px}.btns>*{flex:1}
.pick{display:flex;gap:8px;margin-top:10px}
.pick label{flex:1;margin:0;text-align:center;background:var(--acc-s);color:var(--acc);border-radius:12px;padding:14px 6px;font-size:14px;cursor:pointer}
.pick input{display:none}
#pPrev{width:100%;max-height:240px;object-fit:cover;border-radius:14px;margin-top:10px;display:none}
.opt{display:flex;gap:8px;margin-top:10px}
.opt label{flex:1;margin:0;border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer;color:var(--ink)}
.opt input{display:none}.opt label:has(input:checked){border-color:var(--acc);background:var(--acc-s)}
.opt b{display:block;font-size:18px}
.res-row{display:grid;grid-template-columns:1fr 80px 30px;gap:6px;margin-top:6px;align-items:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90%}
#toast.on{opacity:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--mute);font-weight:800;padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;position:relative;background:var(--bg)}
.cal .d.x{background:none;cursor:default}
.cal .d.today{outline:2px solid var(--acc)}
.cal .d.okk{background:var(--ok-s);color:var(--ok)}.cal .d.over{background:var(--warn-s);color:var(--warn)}.cal .d.some{background:var(--acc-s)}
.cal .d i{font-style:normal;font-size:10px;line-height:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800}.stat span{font-size:11px;color:var(--mute);font-weight:700}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:none;color:var(--mute);padding:7px}.seg button.on{background:var(--card);color:var(--acc)}
.chart{position:relative;height:200px}
.hist{padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.hist:first-child{border-top:0}
.hist .top{display:flex;justify-content:space-between;font-weight:700}
.hist .sub{font-size:12px;color:var(--mute);margin-top:2px}
.hist .bar{margin-top:6px;height:6px}
.chatbox{display:flex;flex-direction:column;gap:10px;padding-bottom:130px}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;line-height:1.45;font-size:15px}
.msg.u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.msg.m{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg ul{padding-left:18px;margin:4px 0}
.act{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.act button{font-size:13px;padding:8px 10px;text-align:left}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.chips button{white-space:nowrap;font-size:13px;padding:7px 11px}
.composer{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 16px;z-index:9}
.composer .in{max-width:608px;margin:0 auto}
.composer .row textarea{min-height:44px;height:44px}
.composer .row button{flex:0 0 auto}
/* czat na ekranie Dziś */
.mini .msgs{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;padding:2px 2px 6px;margin-bottom:8px}
.mini .msg{max-width:92%;font-size:14px}
.mini .msg.m{background:var(--bg)}
.mini .row textarea{min-height:44px;height:44px}
.mini .row button{flex:0 0 auto}
/* splash */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;overflow:hidden;
  background:radial-gradient(circle at 30% 20%,#ff8fab 0%,#e0517a 40%,#9c1450 100%);transition:opacity .6s,transform .6s}
#splash .logo,#splash h1,#splash .hi,#splash .msg2{position:relative;z-index:2}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
#splash .logo{width:170px;height:170px;animation:pop 1s cubic-bezier(.2,1.6,.4,1) both, beat 1.2s 1.1s ease-in-out infinite}
#splash .logo .ringd{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.4s .3s ease-out forwards}
#splash .burst{position:absolute;width:12px;height:12px;border-radius:50%;background:#ffd166;opacity:0;animation:burst 1.6s .7s ease-out forwards}
#splash h1{font-size:46px;font-weight:800;letter-spacing:-.02em;margin-top:18px;animation:up .8s .6s both;text-shadow:0 6px 24px rgba(80,0,30,.35)}
#splash h1 span{display:inline-block;background:#ffd166;color:#8a1446;border-radius:14px;padding:0 12px;margin-left:8px;font-size:34px;vertical-align:6px;animation:pop .7s 1.1s cubic-bezier(.2,1.8,.4,1) both}
#splash .hi{font-size:22px;font-weight:800;margin-top:14px;animation:up .8s 1.4s both}
#splash .msg2{font-size:16px;font-weight:600;opacity:.92;margin-top:8px;max-width:340px;line-height:1.45;animation:up .8s 1.8s both}
#splash .prog{position:absolute;bottom:calc(40px + env(safe-area-inset-bottom));width:160px;height:5px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
#splash .prog i{display:block;height:100%;width:0;background:#fff;border-radius:5px;animation:fill 4s linear forwards}
@keyframes pop{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}45%{transform:scale(1.06)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes up{0%{transform:translateY(24px);opacity:0}100%{transform:none;opacity:1}}
@keyframes fill{to{width:100%}}
#splash .fh{position:absolute;bottom:-60px;line-height:1;pointer-events:none;opacity:0;filter:drop-shadow(0 4px 8px rgba(90,0,35,.3));animation:floatUp var(--d) var(--dl) ease-in forwards}
#splash .fh span{display:block;animation:sway 1.4s ease-in-out infinite alternate}
#splash .tw{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;opacity:0;animation:twinkle 1.2s var(--dl) ease-in-out infinite}
@keyframes floatUp{0%{transform:translateY(0) scale(.6) rotate(var(--r));opacity:0}12%{opacity:1}80%{opacity:.9}100%{transform:translateY(calc(-100vh - 120px)) scale(1.15) rotate(calc(var(--r) * -1));opacity:0}}
@keyframes sway{from{transform:translateX(calc(var(--s) * -1))}to{transform:translateX(var(--s))}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.3)}}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.2)}}
</style>
</head>
<body>
<div id="splash" onclick="hideSplash()">
  <svg class="logo" viewBox="0 0 200 200" aria-hidden="true">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a96"/><stop offset="1" stop-color="#b01656"/></linearGradient></defs>
    <circle class="ringd" cx="100" cy="100" r="92" fill="none" stroke="#ffd166" stroke-width="6" stroke-linecap="round" transform="rotate(-90 100 100)"/>
    <path d="M100 168 C 40 125 22 95 30 68 C 38 40 75 32 100 60 C 125 32 162 40 170 68 C 178 95 160 125 100 168 Z" fill="#fff"/>
    <text x="100" y="118" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-weight="800" font-size="64" fill="url(#lg)">K</text>
  </svg>
  <h1>Kasia<span>2.0</span></h1>
  <div class="hi" id="spHi"></div>
  <div class="msg2" id="spMsg"></div>
  <div class="prog"><i></i></div>
</div>
<header><h1>Kasia <span>2.0</span></h1><div class="sync" id="sync"></div></header>
<main id="view"></main>
<nav id="nav">
  <button data-v="today" class="on"><b>🍽️</b>Dziś</button>
  <button data-v="cal"><b>📅</b>Kalendarz</button>
  <button data-v="stats"><b>📊</b>Statystyki</button>
  <button data-v="chat"><b>💬</b>Czat AI</button>
  <button data-v="set"><b>⚙️</b>Ustawienia</button>
</nav>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
/* ===================== Ustawienia stałe ===================== */
const COL = 'kasia_kalorie';            // kolekcja w Firestore
const DEF = {name:'Kasia',sex:'K',age:30,height:165,weight:62,goal:'redukcja',delta:400,overPct:15,overDefault:'zostaw',stepBase:2000,stepGoal:8000};
const MET = [
 ['silownia','Siłownia – trening siłowy',5.0],['silownia_int','Siłownia – intensywny / obwodowy',6.0],
 ['bieznia','Bieżnia – szybki marsz',5.0],['bieg','Bieganie',9.8],['rower','Rower / rowerek',7.0],
 ['orbitrek','Orbitrek',5.0],['stepper','Stepper / schody',8.0],['hiit','HIIT / interwały',8.0],
 ['fitness','Fitness / aerobik',6.5],['pilates','Pilates',3.0],['joga','Joga / stretching',2.5],
 ['plywanie','Pływanie',6.0],['spacer','Spacer',3.5],['taniec','Taniec / zumba',5.5],['inne','Inne',4.0]];
const MEALS = ['Śniadanie','II śniadanie','Obiad','Podwieczorek','Kolacja','Przekąska'];
const DOW = ['Pn','Wt','Śr','Cz','Pt','So','Nd'];
const MON = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];

/* ===================== Narzędzia ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => {const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today = () => ds(new Date());
const addDays = (s,n) => {const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const uid = () => Math.random().toString(36).slice(2,8)+Date.now().toString(36);
const r0 = n => Math.round(+n||0);
const num = v => {const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const fmt = n => r0(n).toLocaleString('pl-PL');
function dayLabel(s){
  const t=today();
  if(s===t) return 'Dziś';
  if(s===addDays(t,-1)) return 'Wczoraj';
  return pd(s).toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function loadJs(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function clean(o){return JSON.parse(JSON.stringify(o))}

/* ===================== Stan i zapis ===================== */
let profile = {...DEF}, days = {}, chat = [];
let local = LS.get('kk_local',{key:'',model:'gemini-2.5-flash',fb:''});
let sel = today(), view = 'today', calM = new Date(), statRange = 30, charts = [];

function parseFb(txt){
  if(!txt||!txt.trim()) return null;
  try{return JSON.parse(txt)}catch(e){}
  const o={};const re=/(\w+)\s*:\s*["']([^"']+)["']/g;let m;
  while((m=re.exec(txt))) o[m[1]]=m[2];
  return o.apiKey&&o.projectId?o:null;
}
const Store = {
  cloud:false, db:null,
  async init(){
    profile={...DEF,...LS.get('kk_profile',{})}; days=LS.get('kk_days',{}); chat=LS.get('kk_chat',[]);
    const cfg=parseFb(local.fb);
    if(cfg){
      try{
        $('#sync').textContent='łączenie…';
        await loadJs('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
        await loadJs('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
        if(!firebase.apps.length) firebase.initializeApp(cfg);
        this.db=firebase.firestore();
        const snap=await this.db.collection(COL).get();
        if(snap.empty){ // pierwsze połączenie – wyślij dane lokalne
          this.cloud=true; await this.pushAll();
        }else{
          const nd={};
          snap.forEach(doc=>{
            if(doc.id==='_profile') profile={...DEF,...doc.data()};
            else if(doc.id==='_chat') chat=doc.data().msgs||[];
            else nd[doc.id]=doc.data();
          });
          days=nd; this.cloud=true; this.cache();
        }
      }catch(e){console.error(e);toast('Brak połączenia z Firebase – zapisuję lokalnie')}
    }
    $('#sync').textContent=this.cloud?'☁️ chmura':'📱 lokalnie';
  },
  cache(){LS.set('kk_profile',profile);LS.set('kk_days',days);LS.set('kk_chat',chat.slice(-100))},
  async w(id,data){
    this.cache();
    if(!this.cloud) return;
    try{await this.db.collection(COL).doc(id).set(clean(data))}catch(e){console.error(e);toast('Błąd zapisu w chmurze (zapisane lokalnie)')}
  },
  day(date){return this.w(date,days[date])},
  prof(){return this.w('_profile',profile)},
  chat(){chat=chat.slice(-100);return this.w('_chat',{msgs:chat})},
  async pushAll(){
    await this.prof(); await this.chat();
    for(const k of Object.keys(days)) await this.day(k);
  }
};

function getDay(s){
  if(!days[s]) days[s]={meals:[],workouts:[],steps:0,weight:null,note:'',ai:''};
  const d=days[s]; d.meals??=[]; d.workouts??=[];
  return d;
}

/* ===================== Obliczenia ===================== */
function curWeight(s){
  const keys=Object.keys(days).filter(k=>k<=s&&days[k].weight).sort();
  return keys.length?num(days[keys.at(-1)].weight):num(profile.weight);
}
function bmr(w){
  const b=10*w+6.25*num(profile.height)-5*num(profile.age);
  return profile.sex==='M'?b+5:b-161;
}
function goalAdj(){return profile.goal==='redukcja'?-num(profile.delta):profile.goal==='masa'?num(profile.delta):0}
function calc(s){
  const d=days[s]||{meals:[],workouts:[],steps:0};
  const w=curWeight(s), B=bmr(w), base=B*1.2;
  const stepsK=Math.max(0,num(d.steps)-num(profile.stepBase))*0.0005*w;
  const workK=(d.workouts||[]).reduce((a,x)=>a+num(x.kcal),0);
  const tdee=base+stepsK+workK, adj=goalAdj();
  const target=Math.max(r0(tdee+adj),r0(B));
  const m=(d.meals||[]).reduce((a,x)=>({k:a.k+num(x.kcal),p:a.p+num(x.p),c:a.c+num(x.c),f:a.f+num(x.f)}),{k:0,p:0,c:0,f:0});
  const pT=r0(1.8*w), fT=r0(target*0.27/9), cT=Math.max(0,r0((target-pT*4-fT*9)/4));
  return {w,B,base,stepsK,workK,tdee,adj,target,eaten:m.k,p:m.p,c:m.c,f:m.f,pT,fT,cT,burned:stepsK+workK};
}
function wkKcal(type,min,s){const m=(MET.find(x=>x[0]===type)||MET.at(-1))[2];return r0(m*curWeight(s)*num(min)/60)}
const isGym = t => String(t).startsWith('silownia');
const wkName = t => (MET.find(x=>x[0]===t)||['', t])[1];
function defType(){const h=new Date().getHours();return h<10?'Śniadanie':h<12?'II śniadanie':h<15?'Obiad':h<17?'Podwieczorek':h<21?'Kolacja':'Przekąska'}

/* ===================== Gemini ===================== */
async function gemini(parts,{json=false,system='',history=[],temp=0.7}={}){
  if(!local.key){toast('Dodaj klucz Gemini w Ustawieniach');throw new Error('no key')}
  const body={contents:[...history,{role:'user',parts}],generationConfig:{temperature:temp}};
  if(json) body.generationConfig.responseMimeType='application/json';
  if(system) body.systemInstruction={parts:[{text:system}]};
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(local.model||'gemini-2.5-flash')}:generateContent?key=${encodeURIComponent(local.key)}`,
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok){const msg=j.error?.message||r.status;toast('Gemini: '+msg);throw new Error(msg)}
  const txt=(j.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
  if(!json) return txt.trim();
  return JSON.parse(txt.replace(/^```(json)?/i,'').replace(/```$/,'').trim());
}

/* ===================== Widok: Kalendarz ===================== */
function vCal(){
  const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),t=today();
  let cells=DOW.map(d=>`<div class="h">${d}</div>`).join('')+'<div class="d x"></div>'.repeat(off);
  let wkM=0,gymM=0,kM=0;const list=[];
  for(let i=1;i<=dim;i++){
    const s=`${y}-${pad(m+1)}-${pad(i)}`,d=days[s];let cls='',ic='';
    if(hasData(d)){
      if(d.meals?.length){const c=calc(s),r=c.eaten/c.target;cls=r>1.08?'over':r>=0.75?'okk':'some'}else cls='some';
      const gy=(d.workouts||[]).filter(w=>isGym(w.type)).length, ot=(d.workouts||[]).length-gy;
      if(gy) ic+='🏋️'; if(ot) ic+='🏃‍♀️';
      wkM+=(d.workouts||[]).length;gymM+=gy;kM+=(d.workouts||[]).reduce((a,w)=>a+num(w.kcal),0);
      (d.workouts||[]).forEach(w=>list.push([s,w]));
    }
    cells+=`<div class="d ${cls} ${s===t?'today':''}" onclick="${s<=t?`goDay('${s}')`:''}">${i}<i>${ic}</i></div>`;
  }
  // tydzień bieżący
  const mon=addDays(t,-((pd(t).getDay()+6)%7));let wkW=0,gymW=0;
  for(let i=0;i<7;i++){const d=days[addDays(mon,i)];(d?.workouts||[]).forEach(w=>{wkW++;if(isGym(w.type))gymW++})}
  // seria dni z zapisem
  let streak=0,s=t;if(!hasData(days[s]))s=addDays(s,-1);while(hasData(days[s])){streak++;s=addDays(s,-1)}
  $('#view').innerHTML=`
  <section class="card">
    <div class="datebar" style="margin:0 0 12px"><button onclick="calM=new Date(${y},${m-1},1);render()">‹</button>
      <div class="dlabel" style="text-transform:capitalize">${MON[m]} ${y}</div>
      <button onclick="calM=new Date(${y},${m+1},1);render()">›</button></div>
    <div class="cal">${cells}</div>
    <div class="legend"><span style="--c:var(--ok-s)">w celu</span><span style="--c:var(--warn-s)">ponad cel</span><span style="--c:var(--acc-s)">częściowo</span><span>🏋️ siłownia</span><span>🏃‍♀️ inny trening</span></div>
  </section>
  <section class="card"><h2>Aktywność</h2>
    <div class="g3">
      <div class="stat"><b>${gymW}</b><span>siłownia w tym tyg.</span></div>
      <div class="stat"><b>${gymM}</b><span>siłownia w miesiącu</span></div>
      <div class="stat"><b>${wkM}</b><span>treningi w miesiącu</span></div>
      <div class="stat"><b>${wkW}</b><span>treningi w tym tyg.</span></div>
      <div class="stat"><b>${fmt(kM)}</b><span>kcal z treningów</span></div>
      <div class="stat"><b>${streak}🔥</b><span>dni z rzędu z zapisem</span></div>
    </div>
  </section>
  <section class="card"><h2>Treningi – ${MON[m]}</h2>
    ${list.length?list.reverse().map(([s,w])=>`<div class="item" onclick="goDay('${s}')"><div class="t"><div>${isGym(w.type)?'🏋️':'🏃‍♀️'} ${esc(wkName(w.type))}</div><small>${pd(s).toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'short'})} · ${r0(w.min)} min${w.note?' · '+esc(w.note):''}</small></div><div class="k">−${fmt(w.kcal)}</div></div>`).join(''):'<div class="empty">Brak treningów w tym miesiącu.</div>'}
  </section>`;
}

/* ===================== Widok: Czat AI ===================== */
function md(t){
  return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n').map(l=>/^\s*[-•*]\s+/.test(l)?'<li>'+l.replace(/^\s*[-•*]\s+/,'')+'</li>':l).join('\n')
    .replace(/(<li>.*?<\/li>\n?)+/gs,m=>'<ul>'+m.replace(/\n/g,'')+'</ul>').replace(/\n/g,'<br>');
}
function actLabel(a){
  const dt=a.date&&a.date!==today()?` (${a.date})`:'';
  if(a.type==='add_meal') return `➕ Dodaj: ${a.name} – ${r0(a.kcal)} kcal${dt}`;
  if(a.type==='add_workout') return `🏋️ Dodaj trening: ${wkName(a.kind)} ${r0(a.minutes)} min${a.kcal?` – ${r0(a.kcal)} kcal`:''}${dt}`;
  if(a.type==='set_steps') return `👣 Ustaw kroki: ${fmt(a.steps)}${dt}`;
  if(a.type==='set_weight') return `⚖️ Zapisz wagę: ${a.weight} kg${dt}`;
  return JSON.stringify(a);
}

function sysBase(){

function dayLine(k,detail){

  if(d.workouts?.length) s+=`, treningi: ${d.workouts.map(w=>`${wkName(w.type)} ${r0(w.min)}min ${r0(w.kcal)}kcal${w.note?' ('+w.note+')':''}`).join('; ')}`;

Możliwe akcje:
{"type":"add_meal","date":"RRRR-MM-DD","name":"...","mealType":"${MEALS.join('|')}","kcal":0,"p":0,"c":0,"f":0}
{"type":"add_workout","date":"RRRR-MM-DD","kind":"${MET.map(m=>m[0]).join('|')}","minutes":0,"kcal":0}  (kcal=0 → aplikacja wyliczy sama)

  $('#view').innerHTML=`
  <section class="card"><h2>👤 Profil</h2>
    <div class="g2">${f('sName','Imię',p.name,'text')}<label>Płeć<select id="sSex"><option value="K" ${p.sex!=='M'?'selected':''}>Kobieta</option><option value="M" ${p.sex==='M'?'selected':''}>Mężczyzna</option></select></label>
    ${f('sAge','Wiek',p.age)}${f('sH','Wzrost (cm)',p.height)}${f('sW','⚖️ Aktualna waga (kg)',w,'number','step="0.1" inputmode="decimal"')}
    <label>Cel<select id="sGoal">${[['redukcja','Redukcja'],['utrzymanie','Utrzymanie'],['masa','Budowa masy']].map(([v,l])=>`<option value="${v}" ${p.goal===v?'selected':''}>${l}</option>`).join('')}</select></label>
    ${f('sDelta','Deficyt / nadwyżka (kcal)',p.delta)}${f('sStepGoal','Cel kroków',p.stepGoal)}</div>
    <div class="small mute" style="margin-top:6px">Wagę wpisujesz tylko tutaj – każda zmiana trafia też do wykresu w Statystykach.</div>
    <details><summary>Zaawansowane</summary>
      <div class="g2">${f('sOver','Zawyżanie AI (%)',p.overPct)}
      <label>Domyślnie przy zdjęciu<select id="sOverDef"><option value="zostaw" ${p.overDefault!=='zawyz'?'selected':''}>Zostaw wynik</option><option value="zawyz" ${p.overDefault==='zawyz'?'selected':''}>Lekko zawyż</option></select></label>
      ${f('sBase','Kroki wliczone w bazę',p.stepBase)}</div>
      <div class="small mute" style="margin-top:6px">Podstawa dnia (BMR×1,2) zawiera już codzienny ruch ok. ${fmt(p.stepBase)} kroków – liczę kalorie tylko z kroków ponad tę liczbę, żeby nie liczyć ich podwójnie.</div>
    </details>
    <button style="width:100%;margin-top:14px" onclick="saveProfile()">Zapisz profil</button>
  </section>
  <section class="card"><h2>🧮 Kalkulator zapotrzebowania</h2>
    <div class="calc small">
      <div><span>BMR (Mifflin-St Jeor, ${w} kg)</span><b>${fmt(B)} kcal</b></div>
      <div><span>Dzień bez ruchu (×1,2)</span><b>${fmt(B*1.2)} kcal</b></div>
    </div>
    <div class="g2" style="margin-top:8px">${f('kSteps','Kroki',p.stepGoal,'number','oninput="kcalc()"')}
      <label>Trening<select id="kType" onchange="kcalc()">${MET.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join('')}</select></label>
      ${f('kMin','Minuty treningu','60','number','oninput="kcalc()"')}</div>
    <div class="card" style="margin:10px 0 0;text-align:center" id="kRes"></div>
  </section>
  <section class="card"><h2>✨ Gemini (AI)</h2>
    <label>Klucz API (Google AI Studio)<input id="sKey" type="password" value="${esc(local.key)}" placeholder="AIza…"></label>
    <label>Model<input id="sModel" value="${esc(local.model)}"></label>
    <div class="small mute" style="margin-top:6px">Klucz zostaje tylko w tej przeglądarce – nie trafia do repozytorium ani do bazy.</div>
    <button class="ghost" style="width:100%;margin-top:10px" onclick="saveLocal()">Zapisz</button>
  </section>
  <section class="card"><h2>☁️ Firebase (synchronizacja) <span class="small ${Store.cloud?'ok':'mute'}">${Store.cloud?'połączono':'wyłączona'}</span></h2>
    <label>Konfiguracja (wklej firebaseConfig z konsoli)<textarea id="sFb" placeholder="{ apiKey: '…', authDomain: '…', projectId: '…', … }">${esc(local.fb)}</textarea></label>
    <div class="small mute" style="margin-top:6px">Dane trafiają do kolekcji <b>${COL}</b>. Bez Firebase wszystko zapisuje się w telefonie.</div>
    <button class="ghost" style="width:100%;margin-top:10px" onclick="saveLocal(true)">Zapisz i połącz</button>
  </section>
  <section class="card"><h2>💾 Kopia zapasowa</h2>
    <div class="g2"><button class="ghost" onclick="exportData()">⬇️ Eksport JSON</button>
    <label class="ghost" style="margin:0;background:var(--acc-s);color:var(--acc);border-radius:12px;padding:11px;text-align:center;font-size:15px;cursor:pointer">⬆️ Import<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label></div>
  </section>`;
  kcalc();
}
function kcalc(){
  const w=curWeight(today()),base=bmr(w)*1.2,st=Math.max(0,num($('#kSteps').value)-num(profile.stepBase))*0.0005*w,wk=wkKcal($('#kType').value,$('#kMin').value,today());
  const tdee=base+st+wk;
  $('#kRes').innerHTML=`Spalanie: <b>${fmt(tdee)} kcal</b><div class="small mute">baza ${fmt(base)} + kroki ${fmt(st)} + trening ${fmt(wk)}</div><div style="margin-top:6px">Cel (${goalLabel()}): <b>${fmt(Math.max(tdee+goalAdj(),bmr(w)))} kcal</b></div>`;
}
async function saveProfile(){
  const nw=num($('#sW').value);
  if(nw&&nw!==curWeight(today())){getDay(today()).weight=nw;await Store.day(today())} // zapis do historii wagi
  Object.assign(profile,{name:$('#sName').value.trim()||'Kasia',sex:$('#sSex').value,age:num($('#sAge').value),height:num($('#sH').value),weight:nw||profile.weight,
    goal:$('#sGoal').value,delta:num($('#sDelta').value),stepGoal:num($('#sStepGoal').value),overPct:num($('#sOver').value),overDefault:$('#sOverDef').value,stepBase:num($('#sBase').value)});
  await Store.prof();toast('Profil zapisany');render();
}
async function saveLocal(reconnect){
  local={key:$('#sKey').value.trim(),model:$('#sModel').value.trim()||'gemini-2.5-flash',fb:$('#sFb').value.trim()};
  LS.set('kk_local',local);
  if(reconnect){toast('Łączę…');setTimeout(()=>location.reload(),400)}else toast('Zapisano');
}
function exportData(){
  const b=new Blob([JSON.stringify({profile,days,chat,exported:new Date().toISOString()},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`kasia-kcal-${today()}.json`;a.click();
}
async function importData(inp){
  const f=inp.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());if(!j.days)throw 0;
    if(!confirm('Zastąpić obecne dane danymi z pliku?'))return;
    profile={...DEF,...j.profile};days=j.days;chat=j.chat||[];
    Store.cache();if(Store.cloud)await Store.pushAll();toast('Zaimportowano');render();
  }catch(e){toast('Nieprawidłowy plik')}
}

/* ===================== Start ===================== */
function voc(n){return n==='Kasia'?'Kasiu':n}
function hideSplash(){const s=$('#splash');if(!s||s.classList.contains('out'))return;s.classList.add('out');setTimeout(()=>s.remove(),650)}
function splash(){
  const h=new Date().getHours(),n=voc(profile.name||'Kasia');
  const hi=h<5?`Dobrej nocy, ${n} 🌙`:h<12?`Dzień dobry, ${n}! ☀️`:h<18?`Cześć, ${n}! 🌸`:`Dobry wieczór, ${n} ✨`;
  const msgs=['Tak się cieszę, że jesteś! Każdy dzień to nowa szansa – a Ty świetnie sobie radzisz 💖',
    'Jesteś silniejsza, niż myślisz. Małe kroki każdego dnia robią wielką różnicę 💪',
    'Dbasz o siebie – i to jest najpiękniejsze. Zróbmy razem kolejny dobry dzień 🌷',
    'Witaj z powrotem! Twoja konsekwencja naprawdę robi wrażenie ⭐',
    'Uśmiechnij się – jesteś w dobrych rękach i na dobrej drodze 😊',
    'Każdy zapisany posiłek i każdy krok się liczy. Jestem z Ciebie dumna! 🎉'];
  $('#spHi').textContent=hi;$('#spMsg').textContent=msgs[Math.floor(Math.random()*msgs.length)];
  const sp=$('#splash');
  for(let i=0;i<14;i++){const b=document.createElement('i');b.className='burst';const a=i/14*Math.PI*2,r=120+Math.random()*80;
    b.style.cssText=`--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r-80}px;top:50%;left:50%;margin:-90px 0 0 -6px;background:${['#ffd166','#fff','#ffb3c6'][i%3]}`;sp.appendChild(b)}
  // serduszka unoszące się po bokach
  const em=['💖','💗','💕','❤️','🩷','💘','💞'];
  for(let i=0;i<34;i++){
    const left=i%2===0, h=document.createElement('div'); h.className='fh';
    const x=left?Math.random()*24:76+Math.random()*24, sz=18+Math.random()*32;
    h.style.cssText=`left:calc(${x}% - ${sz/2}px);font-size:${sz}px;--d:${(2.2+Math.random()*1.1).toFixed(2)}s;--dl:${(Math.random()*1.7).toFixed(2)}s;--r:${(left?-1:1)*(10+Math.random()*20)}deg`;
    h.innerHTML=`<span style="--s:${6+Math.random()*14}px">${em[i%em.length]}</span>`;
    sp.appendChild(h);
  }
  for(let i=0;i<20;i++){const t=document.createElement('i');t.className='tw';const left=i%2===0;
    t.style.cssText=`left:${left?3+Math.random()*25:72+Math.random()*25}%;top:${8+Math.random()*80}%;--dl:${(Math.random()*1.5).toFixed(2)}s`;sp.appendChild(t)}
  setTimeout(hideSplash,4000);
}
(async()=>{profile={...DEF,...LS.get('kk_profile',{})};splash();await Store.init();render()})();</script>
</body>
</html>
